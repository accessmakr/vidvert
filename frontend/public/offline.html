<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidVert — No Connection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; text-align: center; gap: 1.5rem;
    }
    h1 { font-size: 2rem; font-weight: 700; }
    h1 span { color: #60a5fa; }
    .icon { font-size: 3rem; }
    p { color: #71717a; font-size: 0.9rem; max-width: 300px; line-height: 1.6; }
    button {
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      padding: 12px 24px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3b82f6; }
    .tip {
      background: #18181b; border: 1px solid #27272a;
      border-radius: 12px; padding: 1rem; max-width: 320px;
    }
    .tip p { color: #a1a1aa; font-size: 0.8rem; }
    .tip strong { color: #d4d4d8; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Vid<span>Vert</span></h1>
  <p>You appear to be offline. Check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <div class="tip">
    <p>
      <strong>Tip:</strong> VidVert works as an installed app — add it to your home screen
      for faster loading and offline access to the interface.
    </p>
  </div>
</body>
</html>
